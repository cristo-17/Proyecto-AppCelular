spring.application.name=AppCelulares
# CONFIGURACIÓN DE CONEXIÓN A MYSQL

spring.datasource.url=jdbc:mysql://localhost:3306/db_celulares?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURACIÓN DE JPA E HIBERNATE (ORM)

# "update" hace que Spring cree o actualice las tablas automáticamente en MySQL
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola de VS Code los queries SQL que se ejecutan por detrás
spring.jpa.show-sql=true

# Especifica el dialecto de MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect