<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AppCelulares - Mi Carrito</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
      <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"
          ><i class="bi bi-phone"></i> AppCelulares</a
        >
        <div class="d-flex align-items-center">
          <span class="text-white me-3 fw-bold"
            >Hola, <span th:text="${session.usuarioNombre}"></span
          ></span>
          <a th:href="@{/catalogo}" class="btn btn-outline-light btn-sm me-2"
            ><i class="bi bi-shop"></i> Seguir Comprando</a
          >
          <a
            th:href="@{/logout}"
            class="btn btn-danger btn-sm"
            title="Cerrar Sesión"
            ><i class="bi bi-box-arrow-right"></i
          ></a>
        </div>
      </div>
    </nav>

    <div class="container my-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">
          <i class="bi bi-cart3 text-primary"></i> Mi Carrito de Compras
        </h2>
      </div>

      <div class="row">
        <div class="col-lg-8 mb-4">
          <div class="card shadow-sm border-0">
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th class="ps-4">Producto</th>
                      <th class="text-center">Precio Unit.</th>
                      <th class="text-center">Cantidad</th>
                      <th class="text-center">Subtotal</th>
                      <th class="text-center pe-4">Acción</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:if="${#lists.isEmpty(carrito)}">
                      <td colspan="5" class="text-center text-muted py-5">
                        <i class="bi bi-cart-x fs-1 d-block mb-2"></i>
                        <h5>Tu carrito está vacío</h5>
                        <a th:href="@{/catalogo}" class="btn btn-primary mt-3"
                          >Ir al catálogo</a
                        >
                      </td>
                    </tr>

                    <tr th:each="item : ${carrito}">
                      <td class="ps-4">
                        <div class="d-flex align-items-center">
                          <img
                            th:src="${item.celular.imagenUrl != null and item.celular.imagenUrl != '' ? item.celular.imagenUrl : 'https://via.placeholder.com/50'}"
                            class="img-thumbnail me-3"
                            style="
                              width: 60px;
                              height: 60px;
                              object-fit: contain;
                            "
                            alt="Producto"
                          />
                          <div>
                            <h6
                              class="mb-0 fw-bold"
                              th:text="${item.celular.marca + ' ' + item.celular.modelo}"
                            >
                              Modelo
                            </h6>
                            <small class="text-muted"
                              ><i class="bi bi-shop"></i>
                              <span th:text="${item.celular.proveedor.nombres}"
                                >Proveedor</span
                              ></small
                            >
                          </div>
                        </div>
                      </td>
                      <td
                        class="text-center"
                        th:text="'S/ ' + ${#numbers.formatDecimal(item.celular.precio, 1, 'COMMA', 2, 'POINT')}"
                      >
                        S/ 0.00
                      </td>
                      <td
                        class="text-center fw-bold text-primary"
                        th:text="${item.cantidad}"
                      >
                        1
                      </td>
                      <td
                        class="text-center fw-bold text-success"
                        th:text="'S/ ' + ${#numbers.formatDecimal(item.subtotal, 1, 'COMMA', 2, 'POINT')}"
                      >
                        S/ 0.00
                      </td>
                      <td class="text-center pe-4">
                        <a
                          th:href="@{/carrito/eliminar/{id}(id=${item.celular.id})}"
                          class="btn btn-sm btn-outline-danger"
                          title="Eliminar"
                        >
                          <i class="bi bi-trash"></i>
                        </a>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <h5 class="card-title fw-bold border-bottom pb-3 mb-3">
                Resumen de Orden
              </h5>

              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Subtotal</span>
                <span
                  class="fw-bold"
                  th:text="'S/ ' + ${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}"
                  >S/ 0.00</span
                >
              </div>
              <div class="d-flex justify-content-between mb-3">
                <span class="text-muted">Envío</span>
                <span class="text-success fw-bold">Gratis</span>
              </div>

              <div class="d-flex justify-content-between border-top pt-3 mb-4">
                <h5 class="fw-bold m-0">Total</h5>
                <h4
                  class="text-success fw-bold m-0"
                  th:text="'S/ ' + ${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}"
                >
                  S/ 0.00
                </h4>
              </div>

              <button
                th:if="${not #lists.isEmpty(carrito)}"
                class="btn btn-primary btn-lg w-100 fw-bold"
                onclick="
                  alert(
                    '¡Módulo de Pago en construcción! Tu pedido ha sido procesado exitosamente.',
                  );
                  window.location.href = '/catalogo';
                "
              >
                <i class="bi bi-credit-card"></i> Proceder al Pago
              </button>

              <button
                th:if="${#lists.isEmpty(carrito)}"
                class="btn btn-secondary btn-lg w-100 fw-bold"
                disabled
              >
                <i class="bi bi-credit-card"></i> Proceder al Pago
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
