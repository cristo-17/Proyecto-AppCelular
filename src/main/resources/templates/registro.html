<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <!-- 1. Declaramos Thymeleaf -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AppCelulares - Registro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="bg-light">
    <div
      class="container d-flex justify-content-center align-items-center"
      style="min-height: 100vh"
    >
      <div
        class="card shadow-lg border-0 rounded-4"
        style="width: 100%; max-width: 500px"
      >
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <i
              class="bi bi-person-plus-fill text-success"
              style="font-size: 3rem"
            ></i>
            <h4 class="card-title fw-bold mt-2">Crear una Cuenta</h4>
          </div>

          <!-- Formulario de Registro -->
          <form
            th:action="@{/registro}"
            th:object="${usuario}"
            method="post"
            class="needs-validation"
          >
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Nombres</label>

                <input
                  type="text"
                  class="form-control"
                  th:field="*{nombres}"
                  placeholder="Ej. Juan"
                  required
                />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Apellidos</label>
                <input
                  type="text"
                  class="form-control"
                  th:field="*{apellidos}"
                  placeholder="Ej. Pérez"
                  required
                />
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Correo Electrónico</label>
              <div class="input-group">
                <span class="input-group-text"
                  ><i class="bi bi-envelope"></i
                ></span>
                <input
                  type="email"
                  class="form-control"
                  th:field="*{correo}"
                  placeholder="tu@correo.com"
                  required
                />
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input
                  type="password"
                  class="form-control"
                  th:field="*{contrasena}"
                  placeholder="********"
                  required
                />
              </div>
            </div>

            <!-- Selector de Rol -->
            <div class="mb-4">
              <label class="form-label">¿Cómo deseas registrarte?</label>
              <select class="form-select" th:field="*{rol}">
                <option value="COMPRADOR">Quiero comprar celulares</option>
                <option value="PROVEEDOR">Quiero vender celulares</option>
              </select>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-success py-2 fw-bold">
                Crear Cuenta
              </button>
              <a th:href="@{/}" class="btn btn-outline-secondary py-2"
                >Cancelar</a
              >
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
