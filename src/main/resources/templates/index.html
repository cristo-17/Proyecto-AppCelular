<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AppCelulares - Iniciar Sesión</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"
          ><i class="bi bi-phone"></i> AppCelulares</a
        >
      </div>
    </nav>

    <div
      class="container d-flex justify-content-center align-items-center"
      style="min-height: 80vh"
    >
      <div
        class="card shadow-lg border-0 rounded-4"
        style="width: 100%; max-width: 400px"
      >
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <i
              class="bi bi-box-arrow-in-right text-primary"
              style="font-size: 3rem"
            ></i>
            <h4 class="card-title fw-bold mt-2">Iniciar Sesión</h4>
          </div>

          <!-- Mensaje de Error Dinámico (Para bloqueos de cuenta) -->
          <div
            th:if="${error}"
            class="alert alert-danger text-center shadow-sm py-2"
            role="alert"
          >
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
          </div>

          <!-- Formulario de Inicio de Sesión -->
          <form th:action="@{/login}" method="post">
            <div class="mb-3">
              <label class="form-label fw-bold">Correo Electrónico</label>
              <input
                type="text"
                class="form-control"
                name="correo"
                th:classappend="${errorCorreo != null} ? 'is-invalid' : ''"
                placeholder="juan@correo.com"
                required
              />
              <!-- Etiqueta roja personalizada para el correo -->
              <div
                th:if="${errorCorreo != null}"
                class="invalid-feedback fw-bold"
                th:text="${errorCorreo}"
              ></div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold">Contraseña</label>
              <input
                type="password"
                class="form-control"
                name="contrasena"
                th:classappend="${errorContrasena != null} ? 'is-invalid' : ''"
                placeholder="Mínimo 6 caracteres"
                required
              />
              <!-- Etiqueta roja personalizada para la contraseña -->
              <div
                th:if="${errorContrasena != null}"
                class="invalid-feedback fw-bold"
                th:text="${errorContrasena}"
              ></div>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary py-2 fw-bold">
                <i class="bi bi-box-arrow-in-right"></i> Ingresar
              </button>
            </div>
          </form>

          <div class="text-center mt-4">
            <p class="mb-0 text-muted">¿No tienes cuenta?</p>
            <a th:href="@{/registro}" class="text-decoration-none fw-bold"
              ><i class="bi bi-person-plus"></i> Regístrate aquí</a
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
